<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 大猜想</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700&family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-deep: #0e0e12;
            --text-color: #ffffff;
            --accent-purple: #9d4edd;
            --accent-gold: #ffd700; 
            --card-ratio: 1.618; 
            --card-width-mobile: 130px; 
            --card-width-desktop: 180px;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-deep);
            background-image: radial-gradient(circle at 50% 40%, #1a1a2e 0%, #050508 100%);
            font-family: 'Noto Sans SC', sans-serif;
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* --- 🌟 高亮版星空背景 --- */
        .stars-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .stars-layer {
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background-image: 
                radial-gradient(2px 2px at 10% 10%, rgba(255,255,255,0.8) 50%, transparent),
                radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.8) 50%, transparent),
                radial-gradient(3px 3px at 40% 70%, rgba(255,255,255,0.9) 50%, transparent),
                radial-gradient(3px 3px at 60% 20%, rgba(157, 78, 221, 0.8) 50%, transparent), 
                radial-gradient(2px 2px at 80% 50%, rgba(255,215,0, 0.8) 50%, transparent);
            background-size: 400px 400px; 
            animation: moveStars 100s linear infinite; 
            opacity: 0.8;
        }

        .stars-layer.layer-2 {
            background-size: 600px 600px;
            animation-duration: 150s;
            animation-direction: reverse;
            opacity: 0.6;
        }

        @keyframes moveStars {
            from { transform: translateY(0) rotate(0deg); }
            to { transform: translateY(-200px) rotate(15deg); }
        }


        /* --- 1. 首页 (Landing) --- */
        #landing-screen {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 10;
            position: relative;
            transition: opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1);
            padding: 20px;
        }

        .visual-center {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
            width: 200px; 
            height: 200px;
            justify-content: center;
        }

        /* 气泡样式优化：错落有致 */
        .bubble {
            position: absolute;
            background: rgba(157, 78, 221, 0.25);
            border: 1px solid rgba(157, 78, 221, 0.6);
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            backdrop-filter: blur(4px);
            white-space: nowrap;
            animation: floatBubble 4s ease-in-out infinite;
            box-shadow: 0 4px 15px rgba(157, 78, 221, 0.2);
        }
        
        .bubble-left {
            left: -10px;
            top: 10%;
            animation-delay: 0s;
        }
        
        .bubble-right {
            right: -10px;
            top: 75%;
            animation-delay: 2s;
        }

        @keyframes floatBubble {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .logo-container {
            margin-bottom: 5px;
            animation: popIn 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) both;
            position: relative;
            z-index: 2;
        }
        .app-logo {
            width: 100px;
            height: auto;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.4));
            animation: logoBreath 4s ease-in-out infinite;
        }

        .mystic-logo-container {
            width: 120px;
            height: 120px;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            animation: popInRotate 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
        }
        
        .mystic-logo-container svg {
            width: 160%;
            height: 160%;
            transform: translate(-18%, -18%);
            opacity: 0.6;
        }

        .svg-ring-outer { animation: spinSlow 30s linear infinite; transform-origin: center; }
        .svg-ring-inner { animation: spinSlow 20s linear infinite reverse; transform-origin: center; }
        .svg-core-pulse { animation: corePulse 3s ease-in-out infinite; transform-origin: center; }
        .svg-rays { animation: rayPulse 4s ease-in-out infinite alternate; transform-origin: center; }
        @keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes corePulse { 0%, 100% { transform: scale(1); opacity: 0.8; filter: brightness(1); } 50% { transform: scale(1.15); opacity: 1; filter: brightness(1.3); box-shadow: 0 0 20px var(--accent-purple); } }
        @keyframes rayPulse { 0% { opacity: 0.3; transform: scale(0.95) rotate(0deg); } 100% { opacity: 0.7; transform: scale(1.05) rotate(5deg); } }

        @keyframes popIn { 0% { opacity: 0; transform: scale(0.5) translateY(20px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes popInRotate { 0% { opacity: 0; transform: scale(0.5) rotate(-30deg); } 100% { opacity: 1; transform: scale(1) rotate(0deg); } }
        @keyframes logoBreath { 0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.3)); } 50% { transform: scale(1.05); filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.6)); } }

        h1 {
            font-family: 'Noto Serif SC', serif;
            font-size: 3rem;
            margin: 10px 0;
            letter-spacing: 2px;
            background: linear-gradient(to bottom, #ffffff 10%, #e2c474 60%, #cba33e 100%);
            -webkit-background-clip: text;
            color: transparent;
            line-height: 1.2;
            text-shadow: 0 2px 10px rgba(203, 163, 62, 0.3);
            animation: fadeInUp 1s ease-out 0.4s both;
        }

        .main-subtitle {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.1rem;
            color: #e0e0e0;
            letter-spacing: 1px;
            margin: 10px 0 0 0;
            font-weight: 300;
            animation: breathing 4s ease-in-out infinite, fadeInUp 1s ease-out 0.6s both;
        }
        @keyframes breathing { 0%, 100% { opacity: 0.8; } 50% { opacity: 1; text-shadow: 0 0 10px rgba(255,255,255,0.3); } }

        .btn-start {
            margin-top: 50px;
            padding: 15px 50px;
            background: rgba(157, 78, 221, 0.15);
            border: 1px solid rgba(157, 78, 221, 0.4);
            color: #fff;
            font-size: 1.15rem;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 50px;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            font-family: 'Noto Sans SC', sans-serif;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2), inset 0 0 10px rgba(157, 78, 221, 0.2);
            backdrop-filter: blur(5px);
            animation: fadeInUp 1s ease-out 0.8s both;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn-start::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.3), transparent);
            transform: rotate(45deg) translate(-100%, -100%);
            transition: transform 0.6s;
        }

        .btn-start:hover {
            background: var(--accent-purple);
            border-color: #c77dff;
            box-shadow: 0 6px 30px rgba(157, 78, 221, 0.6), inset 0 0 15px rgba(255,255,255,0.3);
            transform: translateY(-3px);
        }
        .btn-start:hover::after {
            transform: rotate(45deg) translate(100%, 100%);
        }

        .arrow-guide {
            display: inline-block;
            font-size: 1.2rem;
            animation: pointMove 1.5s infinite;
        }
        @keyframes pointMove {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(5px); }
        }
        
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }


        /* --- 2. 抽牌/洗牌容器 (Deck) --- */
        #deck-container {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100%; height: 100%;
            z-index: 5;
            pointer-events: none;
        }

        .card {
            width: var(--card-width-desktop);
            height: calc(var(--card-width-desktop) * var(--card-ratio));
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            perspective: 1000px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.5s; 
            cursor: pointer;
        }

        .card-inner {
            width: 100%; height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s;
        }
        .card.flipped .card-inner { transform: rotateY(180deg); }

        .card-back, .card-front {
            position: absolute;
            width: 100%; height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            overflow: hidden;
        }
        .card-back { background: #151520; border: 1px solid #333; }
        .card-front { transform: rotateY(180deg); background: #000; }
        .card-img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .card-back img { width: 100%; height: 100%; object-fit: cover; }

        /* --- 3. 结果页 (Result) --- */
        #result-screen {
            display: none;
            width: 100%;
            min-height: 100vh;
            padding: 60px 20px 40px 20px;
            box-sizing: border-box;
            flex-direction: column;
            align-items: center;
            overflow-y: auto; 
            opacity: 0;
            transition: opacity 0.5s;
            position: relative;
            z-index: 10;
        }

        .result-cards-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap; 
            gap: 20px; 
            width: 100%;
            max-width: 1000px;
            margin-bottom: 40px; 
            perspective: 1000px;
        }

        .result-card-wrapper {
            position: relative;
            width: var(--card-width-desktop);
            height: calc(var(--card-width-desktop) * var(--card-ratio));
        }
        
        .result-card-wrapper .card {
            position: relative;
            top: auto; left: auto;
            transform: none !important;
            width: 100%; height: 100%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        /* --- 4. 详情弹窗 --- */
        #detail-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 200;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: zoomIn 0.3s ease-out;
            padding: 20px;
            box-sizing: border-box;
        }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        .detail-content {
            position: relative;
            max-width: 420px; 
            width: 90%;       
            text-align: center;
        }
        .detail-img { width: 100%; border-radius: 12px; box-shadow: 0 0 30px rgba(157, 78, 221, 0.4); border: 2px solid #333; }
        .detail-close { position: absolute; top: -50px; right: 0; color: #fff; font-size: 2rem; cursor: pointer; background: rgba(255,255,255,0.1); width: 40px; height: 40px; line-height: 36px; text-align: center; border-radius: 50%; transition: 0.3s; }
        .detail-close:hover { background: rgba(255,255,255,0.2); }
        .btn-detail-link { display: inline-block; margin-top: 25px; padding: 12px 45px; background: var(--accent-purple); color: #fff; text-decoration: none; border-radius: 30px; font-weight: bold; box-shadow: 0 5px 15px rgba(157, 78, 221, 0.4); transition: 0.3s; letter-spacing: 1px; }
        .btn-detail-link:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(157, 78, 221, 0.7); background: #b06ce0; }

        /* --- 底部按钮区 --- */
        .action-bar { display: flex; gap: 20px; margin-top: auto; padding-bottom: 20px; }
        .btn-outline { padding: 12px 35px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: #ddd; border-radius: 30px; cursor: pointer; font-family: 'Noto Sans SC', sans-serif; transition: 0.3s; backdrop-filter: blur(5px); }
        .btn-outline:hover { border-color: #fff; color: #fff; background: rgba(255,255,255,0.1); box-shadow: 0 0 15px rgba(255,255,255,0.1); }

        /* --- 5. 全量图鉴 (Report Modal) --- */
        #report-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 10, 15, 0.98); z-index: 150; overflow-y: auto; padding: 0 0 80px 0; box-sizing: border-box; }
        
        .report-header-area {
            text-align: center;
            padding: 30px 20px 10px 20px;
            background: linear-gradient(to bottom, rgba(14,14,18,0.9), transparent);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .report-title-main { font-family:'Noto Serif SC'; font-size: 1.8rem; color:#fff; margin: 0; letter-spacing: 2px; }
        .report-subtitle { font-size: 0.9rem; color: #aaa; margin-top: 5px; font-weight: 300; }

        .report-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 600px; margin: 10px auto; padding: 0 20px; }
        .report-item { text-align: center; transition: 0.3s; }
        .report-item:hover { transform: translateY(-3px); }
        .report-img { width: 100%; border-radius: 8px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.1); aspect-ratio: 1 / 1.618; object-fit: cover; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        .report-title { font-size: 0.75rem; color: #aaa; margin-top: 5px; letter-spacing: 1px; }
        
        .close-btn-fixed { position: absolute; top: 20px; right: 20px; font-size: 2rem; color: #aaa; cursor: pointer; line-height: 1; z-index: 20; }
        .close-btn-fixed:hover { color: #fff; }

        /* 底部固定操作栏 */
        .report-footer {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.1);
            padding: 15px 20px;
            box-sizing: border-box;
            display: flex;
            gap: 15px;
            justify-content: center;
            z-index: 20;
        }
        .btn-footer {
            flex: 1;
            max-width: 200px;
            padding: 12px 0;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            border: none;
            font-weight: bold;
            transition: 0.3s;
        }
        /* 灰色次要按钮 (完整解读) */
        .btn-footer.btn-secondary { background: #333; color: #ddd; border: 1px solid #555; }
        .btn-footer.btn-secondary:hover { border-color: #999; color: #fff; }
        
        /* 紫色主要按钮 (保存图片) */
        .btn-footer.btn-primary { background: var(--accent-purple); color: #fff; box-shadow: 0 0 15px rgba(157, 78, 221, 0.3); }
        .btn-footer.btn-primary:hover { background: #8e44ad; }

        @media (max-width: 768px) {
            h1 { font-size: 2.2rem; }
            .main-subtitle { font-size: 1rem; padding: 0 10px; line-height: 1.5; }
            :root { --card-width-desktop: var(--card-width-mobile); }
            .result-cards-container { gap: 10px; }
            .btn-outline { padding: 10px 20px; font-size: 0.9rem; }
            .mystic-logo-container { width: 100px; height: 100px; }
            .app-logo { width: 90px; }
        }
    </style>
</head>
<body>
    
    <div class="stars-bg">
        <div class="stars-layer"></div>
        <div class="stars-layer layer-2"></div>
    </div>

    <div id="landing-screen">
        <div class="visual-center">
            <div class="bubble bubble-left">预测</div>
            <div class="bubble bubble-right">展望</div>
            
            <div class="logo-container">
                <img src="images/logo.png" class="app-logo" onerror="this.style.display='none';">
            </div>

            <div class="mystic-logo-container">
                <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="grad-gold" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#cba33e;stop-opacity:1" />
                        </linearGradient>
                        <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#9d4edd;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#3c096c;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <g class="svg-rays" stroke="url(#grad-purple)" stroke-width="2" opacity="0.5">
                        <line x1="100" y1="10" x2="100" y2="30" /><line x1="100" y1="190" x2="100" y2="170" /><line x1="10" y1="100" x2="30" y2="100" /><line x1="190" y1="100" x2="170" y2="100" /><line x1="36.4" y1="36.4" x2="50.5" y2="50.5" /><line x1="163.6" y1="163.6" x2="149.5" y2="149.5" /><line x1="36.4" y1="163.6" x2="50.5" y2="149.5" /><line x1="163.6" y1="36.4" x2="149.5" y2="50.5" />
                    </g>
                    <circle class="svg-ring-outer" cx="100" cy="100" r="70" fill="none" stroke="url(#grad-purple)" stroke-width="1.5" stroke-dasharray="10, 20, 40, 30" opacity="0.6" />
                    <circle class="svg-ring-inner" cx="100" cy="100" r="55" fill="none" stroke="url(#grad-gold)" stroke-width="1" stroke-dasharray="50, 50" opacity="0.4" />
                    <g class="svg-core-pulse" transform-origin="center">
                        <path d="M100 40 L115 85 L160 100 L115 115 L100 160 L85 115 L40 100 L85 85 Z" fill="url(#grad-gold)" opacity="0.3" />
                        <path d="M100 75 C120 75, 140 85, 140 100 C140 115, 120 125, 100 125 C80 125, 60 115, 60 100 C60 85, 80 75, 100 75 Z" fill="none" stroke="url(#grad-gold)" stroke-width="2" />
                        <circle cx="100" cy="100" r="12" fill="url(#grad-purple)" />
                        <circle cx="100" cy="100" r="6" fill="#fff" filter="blur(1px)" />
                    </g>
                </svg>
            </div>
        </div>

        <h1>2026 大猜想</h1>
        <p class="main-subtitle">对新的一年有哪些疑问与期待？</p>
        <button class="btn-start" onclick="startSequence()">
            抽取卡牌 <span class="arrow-guide">➔</span>
        </button>
    </div>

    <div id="deck-container"></div>

    <div id="result-screen">
        <h2 style="font-family: 'Noto Serif SC'; font-weight: normal; margin-bottom: 10px; color: #fff; letter-spacing: 2px;">2026 大猜想</h2>
        <p style="color: rgba(255,255,255,0.6); font-size:0.85rem; margin-bottom:30px; letter-spacing: 1px;">- 点击翻牌 -</p>
        
        <div class="result-cards-container" id="result-cards-area"></div>
        
        <div class="action-bar">
            <button class="btn-outline" onclick="resetDraw()">重新抽取</button>
            <button class="btn-outline" style="border-color: var(--accent-purple); color: var(--accent-purple); background: rgba(157, 78, 221, 0.1);" onclick="openReport()">查看全部</button>
        </div>
    </div>

    <div id="detail-modal">
        <div class="detail-content">
            <div class="detail-close" onclick="closeDetail()">×</div>
            <img id="detail-img-el" src="" class="detail-img">
            <a id="detail-btn-el" href="#" target="_blank" class="btn-detail-link">查看深度解读 ➔</a>
        </div>
    </div>

    <div id="report-modal">
        <div class="close-btn-fixed" onclick="closeReport()">×</div>
        
        <div class="report-header-area">
            <h3 class="report-title-main">2026 大猜想</h3>
            <p class="report-subtitle">对新的一年有哪些疑问与期待？</p>
        </div>

        <div class="report-grid" id="report-grid-area"></div>

        <div class="report-footer">
            <button class="btn-footer btn-secondary" onclick="openFullArticle()">完整解读</button>
            <button class="btn-footer btn-primary" onclick="saveImage()">保存图片</button>
        </div>
    </div>

    <script>
        const cardBackImg = "images/card_back.jpg"; 
        const sharePosterImg = "images/share_poster.jpg";

        const tarotData = [
            { id: 1, title: "黄金天花板", img: "images/card_01.jpg", url: "https://www.jin10.com/topic/gold" },
            { id: 2, title: "诺贝尔和平奖", img: "images/card_02.jpg", url: "https://www.jin10.com" },
            { id: 3, title: "AI泡沫", img: "images/card_03.jpg", url: "https://www.jin10.com" },
            { id: 4, title: "谷歌市值", img: "images/card_04.jpg", url: "https://www.jin10.com" },
            { id: 5, title: "贸易壁垒", img: "images/card_05.jpg", url: "https://www.jin10.com" },
            { id: 6, title: "美联储降息", img: "images/card_06.jpg", url: "https://www.jin10.com" },
            { id: 7, title: "无人驾驶", img: "images/card_07.jpg", url: "https://www.jin10.com" },
            { id: 8, title: "地缘冲突", img: "images/card_08.jpg", url: "https://www.jin10.com" },
            { id: 9, title: "中期选举", img: "images/card_09.jpg", url: "https://www.jin10.com" },
            { id: 10, title: "政权交接", img: "images/card_10.jpg", url: "https://www.jin10.com" },
            { id: 11, title: "复联5好莱坞", img: "images/card_11.jpg", url: "https://www.jin10.com" },
            { id: 12, title: "世界杯夺冠", img: "images/card_12.jpg", url: "https://www.jin10.com" }
        ];

        const landingScreen = document.getElementById('landing-screen');
        const deckContainer = document.getElementById('deck-container');
        const resultScreen = document.getElementById('result-screen');
        const resultArea = document.getElementById('result-cards-area');
        const reportModal = document.getElementById('report-modal');
        const reportGrid = document.getElementById('report-grid-area');
        const detailModal = document.getElementById('detail-modal');
        const detailImgEl = document.getElementById('detail-img-el');
        const detailBtnEl = document.getElementById('detail-btn-el');

        function getCardInnerHTML(data) {
            return `
                <div class="card-inner">
                    <div class="card-back">
                        <img src="${cardBackImg}" onerror="this.parentElement.innerHTML='<div style=\\'color:rgba(255,255,255,0.5);display:flex;justify-content:center;align-items:center;height:100%;font-size:12px;\\'>背面缺失</div>'">
                    </div>
                    <div class="card-front">
                        <img src="${data.img}" class="card-img" alt="${data.title}" 
                             onerror="this.parentElement.style.background='#2a2a3a'; this.parentElement.innerHTML='<div style=\\'color:#ff6b6b;padding:10px;display:flex;flex-direction:column;justify-content:center;align-items:center;height:100%;text-align:center;font-size:12px;\\'>❌ 找不到图片<br>${data.img}</div>'">
                    </div>
                </div>
            `;
        }

        function startSequence() {
            landingScreen.style.opacity = '0';
            setTimeout(() => {
                landingScreen.style.display = 'none';
                runShuffleAnimation();
            }, 800);
        }

        function resetDraw() {
            resultScreen.style.opacity = '0';
            setTimeout(() => {
                resultScreen.style.display = 'none';
                runShuffleAnimation();
            }, 500);
        }

        function runShuffleAnimation() {
            deckContainer.style.display = 'block'; 
            deckContainer.innerHTML = '';
            for(let i=0; i<12; i++) {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.zIndex = i;
                card.innerHTML = getCardInnerHTML({img:'', title:''}); 
                deckContainer.appendChild(card);
            }
            setTimeout(() => {
                const cards = deckContainer.querySelectorAll('.card');
                const radius = window.innerWidth < 600 ? 110 : 160; 
                cards.forEach((card, index) => {
                    const angle = (index / 12) * 360; 
                    const x = Math.cos(angle * Math.PI / 180) * radius;
                    const y = Math.sin(angle * Math.PI / 180) * radius;
                    card.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) rotate(${angle + 90}deg) scale(1.05)`;
                    card.style.boxShadow = '0 15px 40px rgba(0,0,0,0.6)';
                });
                setTimeout(() => {
                    cards.forEach(card => {
                        card.style.transform = `translate(-50%, -50%) rotate(0deg) scale(1)`;
                        card.style.boxShadow = '0 10px 30px rgba(0,0,0,0.5)';
                    });
                    setTimeout(() => {
                        deckContainer.style.display = 'none';
                        revealResults();
                    }, 800); 
                }, 1200); 
            }, 100);
        }

        function revealResults() {
            resultScreen.style.display = 'flex';
            setTimeout(() => { resultScreen.style.opacity = '1'; }, 50);
            resultArea.innerHTML = '';
            const indices = Array.from({length: 12}, (_, i) => i);
            indices.sort(() => Math.random() - 0.5);
            const selectedIndices = indices.slice(0, 3);
            selectedIndices.forEach((idx, i) => {
                const data = tarotData[idx];
                const wrapper = document.createElement('div');
                wrapper.className = 'result-card-wrapper';
                const card = document.createElement('div');
                card.className = 'card';
                const randomTilt = (Math.random() - 0.5) * 6;
                card.style.transform = `rotate(${randomTilt}deg)`;
                card.innerHTML = getCardInnerHTML(data);
                card.onclick = function() {
                    if (this.classList.contains('flipped')) {
                        openDetail(data);
                    } else {
                        this.classList.add('flipped');
                        this.style.transform = `rotate(0deg) scale(1.02)`;
                        this.style.zIndex = 10;
                        setTimeout(() => { openDetail(data); }, 600);
                    }
                };
                wrapper.appendChild(card);
                wrapper.style.opacity = 0;
                wrapper.style.transform = 'translateY(30px)';
                setTimeout(() => {
                     wrapper.style.transition = '0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
                     wrapper.style.opacity = 1;
                     wrapper.style.transform = 'translateY(0)';
                }, i * 150);
                resultArea.appendChild(wrapper);
            });
        }

        function openDetail(data) {
            detailImgEl.src = data.img; 
            detailBtnEl.href = data.url;
            detailBtnEl.style.display = 'inline-block'; 
            detailModal.style.display = 'flex';
        }

        function closeDetail() {
            detailModal.style.display = 'none';
            const cards = document.querySelectorAll('.result-card-wrapper .card');
            cards.forEach(card => {
                card.style.transform = card.style.transform.replace(' scale(1.02)', '');
                card.style.zIndex = 1;
            });
        }

        function openReport() {
            reportModal.style.display = 'block';
            reportGrid.innerHTML = '';
            tarotData.forEach(data => {
                const item = document.createElement('div');
                item.className = 'report-item';
                item.innerHTML = `
                    <img src="${data.img}" class="report-img" onerror="this.parentElement.innerHTML='<div style=\\'color:rgba(255,255,255,0.5);font-size:10px;border:1px solid rgba(255,255,255,0.1);padding:10px;aspect-ratio:1/1.618;display:flex;align-items:center;justify-content:center;\\'>缺失</div>'">
                    <div class="report-title">${data.title}</div>
                `;
                reportGrid.appendChild(item);
            });
        }

        function closeReport() {
            reportModal.style.display = 'none';
        }

        // 跳转完整解读
        function openFullArticle() {
            window.location.href = "https://xnews.jin10.com/details/204685?id=204685";
        }

        // 保存长图 (下载 images/share_poster.jpg)
        function saveImage() {
            const isWechat = /MicroMessenger/i.test(navigator.userAgent);
            if (isWechat) {
                // 微信环境直接打开大图让用户长按
                detailImgEl.src = sharePosterImg;
                detailBtnEl.style.display = 'none'; 
                detailModal.style.display = 'flex';
                alert('请长按图片保存');
                return;
            }
            const link = document.createElement('a');
            link.href = sharePosterImg;
            link.download = '2026_Forecast_Full.jpg';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

    </script>
</body>
</html>
